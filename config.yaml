# RFQ自动老练系统配置文件
# 作者: Chengye Xu
# 日期: 2026-03
#
# 说明：所有可调参数(功率、Drive、脉冲等)均通过EPICS PV读取
#      PV定义在下面的pv.control部分

# ==================== 真空参数 ====================
vacuum:
  threshold: 5.0e-5      # 真空阈值 (Pa)

# ==================== 循环参数 ====================
loop:
  interval: 0.5          # 主循环间隔 (秒)
  max_faults: 20         # 时间窗口内最大故障次数
  fault_window_minutes: 30  # 故障计数滑动窗口(分钟)
  max_iterations: 2000   # 最大迭代次数

  wait_time_default: 1.0    # wait_time PV读取失败时的默认等待时间 (秒)，每次展脉宽等待时间
  wait_after_expand: 10.0    # 每次展脉宽结束后、开始调功率前的等待时间 (秒)
  pulse_step: 0.5           # 脉宽步长 (ms)，临时从config读取，后续改回PV
  persist_start_pulse: false  # 展脉宽后是否将起始脉宽持久化到PV
  max_drive: 1000           # Drive值上限，超过此值且功率仍为0则报错停止
  ## stable_building
  stable_timeout_seconds: 180.0    # 稳定建场超时时间 (秒)
  stable_detuning_cycles: 3       # detuning连续稳定若干个主循环周期后才允许步进Drive

  # 展脉宽模式配置
  reduce_power_before_expand: false  # 展脉宽前是否降功率到init_drive
                                     # true: 降功率模式（原有逻辑）
                                     # false: 不降功率模式（直接展脉宽）



  # RF启动重试配置
  rf_startup:
    max_retry: 5         # RF启动最大重试次数
    retry_interval: 5    # 重试间隔 (秒)
    fault_reset_timeout: 10  # 故障重置超时 (秒)
    # start_frequency: 162.614  # RF启动时写入的起始频率 (MHz)（暂时禁用）



# ==================== PV名称定义 ====================
pv:
  # RF控制PV
  rf:
    rf_on: 'RFQ:LLRF:Con01:RFOn'
    pulse_drive: 'RFQ:LLRF:Con01:AmpPulseDrive'
    cw_drive: 'RFQ:LLRF:Con01:AmpCWDrive'
    pulse_cw: 'RFQ:LLRF:Con01:pulsecw'
    pulse_time: 'RFQ:LLRF:Con01:pulseontime'
    freq_start: 'RFQ:LLRF:Con01:sweepstartfreq'
    sweep: 'RFQ:LLRF:Con01:sweepfrequency'
    tracking: 'RFQ:LLRF:Con01:frequency_tracking'
    power: 'RFQ:LLRF:Con01:rf1power'
    Amp_Limiter: 'RFQ:LLRF:Con01:amplimiter'
    ## stable_building
    detuning_error: 'RFQ:LLRF:Con01:Detuning_Err2' # 失谐PV





  # 故障PV
  fault:
    arc: 'RFQ:LLRF:Con01:Arc_Lock'
    VacInterlock: 'RFQ:LLRF:Con01:Arc_Status'
    interlock2: 'RFQ:LLRF:Con01:Interlock_Status'
    di4: 'RFQ:LLRF:Con01:di4'

    # 重置PV
    reset_interlock: 'RFQ:LLRF:Con01:ResetInterlock'
    ResetPWFaultStat1: 'RFQ:LLRF:Mon01:ResetPWFaultStat'
    ResetPWFaultStat2: 'RFQ:LLRF:Mon02:ResetPWFaultStat'
    VacReset: 'RFQ:LLRF:SPS:Reset' # 真空复位PV
  # 真空PV
  vacuum:
    - 'C1:VAC'
    - 'C2:VAC'
    - 'C3:VAC'
    - 'C4:VAC'
    - 'C5:VAC'
    - 'C6:VAC'




  # 老练控制PV
  control:
    start: 'RFQ:LLRF:Con01:AutoC_Start'
    reset: 'RFQ:LLRF:Con01:AutoC_Reset'
    status: 'RFQ:LLRF:Con01:AutoC_Status'
    power_targets: 'RFQ:LLRF:Con01:AutoC_PowerTargets'
    init_drive: 'RFQ:LLRF:Con01:AutoC_InitDrive'
    pulse_start: 'RFQ:LLRF:Con01:AutoC_PulseStart'
    pulse_end: 'RFQ:LLRF:Con01:AutoC_PulseEnd'
    pulse_step: 'RFQ:LLRF:Con01:AutoC_PulseStep'
    drive_step1: 'RFQ:LLRF:Con01:AutoC_DriveStep1'
    drive_step2: 'RFQ:LLRF:Con01:AutoC_DriveStep2'
    margin_large: 'RFQ:LLRF:Con01:AutoC_MarginLarge'
    margin_small: 'RFQ:LLRF:Con01:AutoC_MarginSmall'
    pulse_wait: 'RFQ:LLRF:Con01:AutoC_PulseWaitTime'
    wait_before_expand: 'RFQ:LLRF:Con01:AutoC_PowerWaitTime'
    pulse_drop: 'RFQ:LLRF:Con01:AutoC_PulseDrop'
    current_target_power: 'RFQ:LLRF:Con01:AutoC_CurrentTargetPower'
    current_pulse: 'RFQ:LLRF:Con01:AutoC_CurrentPulse'
    ## stable_building
    stable_step: 'RFQ:LLRF:Con01:AutoC_stable_step' # 稳定建场步长
    stable_margin: 'RFQ:LLRF:Con01:AutoC_stable_margin' # 稳定建场容差
    stable_power: 'RFQ:LLRF:Con01:AutoC_stable_power' # 稳定建场功率
 
   

# ==================== 日志配置 ====================
# 日志文件存放在 logs/ 目录下，每天午夜自动轮转，保留30天
# 文件命名: logs/rfq_conditioning.log (当天) / logs/rfq_conditioning_2026-04-05.log (历史)
logging:
  level: 'INFO'
  format: '%(asctime)s [%(levelname)s] %(message)s'
