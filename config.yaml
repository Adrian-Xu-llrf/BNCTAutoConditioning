# RFQ自动老练系统配置文件
# 作者: Chengye Xu
# 日期: 2025-11
#
# 说明：所有可调参数(功率、Drive、脉冲等)均通过EPICS PV读取
#      PV定义在下面的pv.control部分

# ==================== 真空参数 ====================
vacuum:
  threshold: 5.0e-5      # 真空阈值 (Pa)

# ==================== 循环参数 ====================
loop:
  interval: 0.5          # 主循环间隔 (秒)
  max_faults: 20         # 最大故障次数
  max_iterations: 1000   # 最大迭代次数

  wait_time_default: 1.0    # wait_time PV读取失败时的默认等待时间 (秒)，每次展脉宽等待时间
  wait_before_expand: 10.0    # 每次展脉宽结束后、开始调功率前的等待时间 (秒)
  pulse_step: 0.5           # 脉宽步长 (ms)，临时从config读取，后续改回PV
  persist_start_pulse: false  # 展脉宽后是否将起始脉宽持久化到PV

  # 展脉宽模式配置
  reduce_power_before_expand: false  # 展脉宽前是否降功率到init_drive
                                     # true: 降功率模式（原有逻辑）
                                     # false: 不降功率模式（直接展脉宽）



  # RF启动重试配置
  rf_startup:
    max_retry: 5         # RF启动最大重试次数
    retry_interval: 2    # 重试间隔 (秒)
    fault_reset_timeout: 5  # 故障重置超时 (秒)

# ==================== PV名称定义 ====================
pv:
  # RF控制PV
  rf:
    rf_on: 'RFQ:LLRF:Con01:Opr_RFOn'
    pulse_drive: 'RFQ:LLRF:Con01:AmpPulseDrive_Set'
    cw_drive: 'RFQ:LLRF:Con01:AmpCWDrive_Set'
    pulse_cw: 'RFQ:LLRF:Con01:pulsecw'
    pulse_time: 'RFQ:LLRF:Con01:RFPulseOnTime_Set'
    sweep: 'RFQ:LLRF:Con01_DAC:FreqSweep_Set'
    tracking: 'RFQ:LLRF:Con01:frequency_tracking'
    power: 'RFQ:LLRF:Con01_RFIn03:Power'



  # 故障PV
  fault:
    arc: 'RFQ:LLRF:Con01:ArcStatus_Rd'
    VacInterlock: 'RFQ:LLRF:Con01:InterlockStatus_Rd'

    interlock2: 'RFQ:LLRF:Con01:InterlockStatus2_Rd'
    di4: 'RFQ:LLRF:Con01:di4'

    SSAComp: 'RFQ:LLRF:Mon02:ForwardPowerComp'
    ReflectedPowerComp: 'RFQ:LLRF:Mon02:ReflectedPowerComp'

    reset_interlock: 'RFQ:LLRF:Con01:ResetInterlock'
    ResetPWFaultStat1: 'RFQ:LLRF:Mon01:ResetPWFaultStat'
    ResetPWFaultStat2: 'RFQ:LLRF:Mon02:ResetPWFaultStat'
    VacReset: 'RFQ:Reset' # 真空复位PV
  # 真空PV
  vacuum:
    - 'RFQ:Vac1'
    - 'RFQ:Vac2'
    - 'RFQ:Vac3'
    - 'RFQ:Vac4'
    - 'RFQ:Vac5'
    - 'RFQ:Vac6'
    - 'RFQ:Vac7'
    - 'RFQ:Vac8'



  # 老练控制PV
  control:
    start: 'RFQ:LLRF:Con01:AutoC_Start'
    reset: 'RFQ:LLRF:Con01:AutoC_Reset'
    status: 'RFQ:LLRF:Con01:AutoC_Status'
    power_targets: 'RFQ:LLRF:Con01:AutoC_PowerTargets'
    current_target_power: 'RFQ:LLRF:Con01:AutoC_CurrentTargetPower'
    init_drive: 'RFQ:LLRF:Con01:AutoC_InitDrive'
    pulse_start: 'RFQ:LLRF:Con01:AutoC_PulseStart'
    pulse_end: 'RFQ:LLRF:Con01:AutoC_PulseEnd'
    pulse_step: 'RFQ:LLRF:Con01:AutoC_PulseStep'
    drive_step1: 'RFQ:LLRF:Con01:AutoC_DriveStep1'
    drive_step2: 'RFQ:LLRF:Con01:AutoC_DriveStep2'
    margin_large: 'RFQ:LLRF:Con01:AutoC_MarginLarge'
    margin_small: 'RFQ:LLRF:Con01:AutoC_MarginSmall'
    pulse_wait: 'RFQ:LLRF:Con01:AutoC_PulseWaitTime'
    wait_before_expand: 'RFQ:LLRF:Con01:AutoC_PowerWaitTime'
    pulse_drop: 'RFQ:LLRF:Con01:AutoC_PulseDrop'
    current_pulse: 'RFQ:LLRF:Con01:AutoC_CurrentPulse'

# ==================== 日志配置 ====================
logging:
  level: 'INFO'
  file: 'rfq_auto_conditioning.log'
  format: '%(asctime)s [%(levelname)s] %(message)s'
